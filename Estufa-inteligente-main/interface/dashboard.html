<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Ambiental</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="text/javascript" charset="utf8"
        src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.js"></script>
    <style>
        /* Estilos Tailwind CSS serão aplicados inline ou através do CDN */
    </style>
</head>

<body class="bg-gray-100 h-screen flex overflow-hidden">
    <aside class="bg-gray-800 text-white w-64 min-h-screen p-4">
    </aside>

    <main class="flex-1 p-6 overflow-y-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold">Dados Ambientais</h1>
        </div>

        <div class="bg-white rounded-lg shadow overflow-hidden">
            <div class="p-6">
                <table id="dadosTable" class="w-full">
                    <thead>
                        <tr>
                            <th>Data/Hora</th>
                            <th>Temperatura (°C)</th>
                            <th>Umidade do Ar (%)</th>
                            <th>Umidade do Solo (%)</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="absolute top-4 left-4">
            <a href="interface.html" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded-full">
                <i class="fas fa-arrow-left mr-2"></i> Voltar
            </a>
        </div>
    </main>

    <div id="dadosModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden">
        <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
            <h3 id="dadosModalTitle" class="text-lg leading-6 font-medium text-gray-900">Inserir Novo Dado</h3>
            <form id="dadosForm" class="mt-2 text-left">
                <div class="mb-4">
                    <label for="temperatura" class="block text-gray-700 text-sm font-bold mb-2">Temperatura (°C):</label>
                    <input type="number" id="temperatura" name="temperatura" required
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700">
                </div>
                <div class="mb-4">
                    <label for="umidade_ar" class="block text-gray-700 text-sm font-bold mb-2">Umidade do Ar (%):</label>
                    <input type="number" id="umidade_ar" name="umidade_ar" required
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700">
                </div>
                <div class="mb-4">
                    <label for="umidade_solo" class="block text-gray-700 text-sm font-bold mb-2">Umidade do Solo (%):</label>
                    <input type="number" id="umidade_solo" name="umidade_solo" required
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700">
                </div>
                <button type="button" id="submitData"
                    class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Inserir</button>
                <button type="button" id="closeModal"
                    class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">Cancelar</button>
            </form>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            var table = $('#dadosTable').DataTable();

            // Função para buscar e exibir os dados
            function fetchData() {
                fetch('http://127.0.0.1:5000/dados') // Use a porta correta (5000)
                    .then(response => response.json())
                    .then(data => {
                        table.clear();
                        data.forEach(function (row) {
                            table.row.add([
                                row.data_hora,
                                row.temperatura,
                                row.umidade_ar,
                                row.umidade_solo,
                                '<a href="#" class="text-red-500 hover:text-red-700"><i class="fas fa-trash-alt"></i></a>'
                            ]);
                        });
                        table.draw();
                    })
                    .catch(error => console.error('Erro ao buscar dados:', error));
            }

            fetchData(); // Carrega os dados ao carregar a página

            // Abrir Modal para Novo Dado
            $('#openModal').click(function () {
                $('#dadosForm')[0].reset();
                $('#dadosModalTitle').text('Inserir Novo Dado');
                $('#dadosModal').removeClass('hidden');
            });

            // Fechar Modal
            $('#closeModal').click(function () {
                $('#dadosModal').addClass('hidden');
            });

            // Enviar dados do formulário
            $('#submitData').click(function () {
                var temperatura = $('#temperatura').val();
                var umidade_ar = $('#umidade_ar').val();
                var umidade_solo = $('#umidade_solo').val();

                fetch('http://127.0.0.1:5000/dados/simulados', { // Use a porta correta (5000)
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        temperatura: temperatura,
                        umidade_ar: umidade_ar,
                        umidade_solo: umidade_solo
                    })
                })
                    .then(response => {
                        if (response.ok) {
                            $('#dadosModal').addClass('hidden');
                            fetchData(); // Atualiza a tabela após inserir os dados
                        } else {
                            console.error('Erro ao inserir dados simulados');
                        }
                    })
                    .catch(error => console.error('Erro ao enviar dados:', error));
            });
        });
    </script>
</body>

</html>
